[package]
name = "hinoki-bindings"
description = "PyO3 bindings exposing the Hinoki native core to Python (hinoki.core)"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false

[lib]
name = "native"
crate-type = ["cdylib", "rlib"]

[dependencies]
pyo3 = { version = "0.30", features = ["abi3-py312", "extension-module"] }
pyo3-async-runtimes = { version = "0.30", features = ["tokio-runtime"] }
hinoki-orm = { path = "../orm" }
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time"] }
chrono = { version = "0.4", default-features = false, features = ["std"] }
uuid = "1"
serde_json = { version = "1", features = ["arbitrary_precision"] }
argon2 = "0.6"
getrandom = "0.4"
subtle = "2"
base64 = "0.22"
regex = "1"
hmac = "0.13"
sha2 = "0.11"
ed25519-dalek = "3"
serde = "1"
