[package]
name = "hinoki-bindings"
description = "PyO3 bindings exposing the Hinoki native core to Python (hinoki.core)"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false

[features]
sql-trace = ["hinoki-orm/sql-trace"]

[lib]
name = "native"
crate-type = ["cdylib", "rlib"]

[dependencies]
pyo3 = { version = "0.30", features = ["abi3-py312"] }
pyo3-async-runtimes = { version = "0.30", features = ["tokio-runtime"] }
hinoki-orm = { path = "../orm" }
hinoki-mail = { path = "../mail" }
hinoki-ratelimit = { path = "../ratelimit" }
kiso = { path = "../kiso" }
socket2 = { version = "0.6", features = ["all"] }
bytes = "1"
tokio = { version = "1", features = ["net", "rt-multi-thread", "sync", "time"] }
time = { version = "0.3", features = ["formatting", "parsing", "macros", "large-dates"] }
uuid = { version = "1", features = ["v4", "v7"] }
serde_json = { version = "1", features = ["arbitrary_precision", "preserve_order"] }
argon2 = "0.6"
getrandom = "0.4"
subtle = "2"
base64 = "0.23"
regex = "1"
hmac = "0.13"
sha2 = "0.11"
ed25519-dalek = "3"
serde = "1"
quick-xml = "0.42"
mimalloc = { version = "0.1.52", default-features = false }
