[package]
name = "hinoki-bindings"
description = "PyO3 bindings exposing the Hinoki native core to Python (hinoki.native)"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false

[lib]
name = "native"
crate-type = ["cdylib", "rlib"]

[dependencies]
pyo3 = { version = "0.30", features = ["abi3-py312", "extension-module"] }
