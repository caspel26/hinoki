[package]
name = "hinoki-orm"
description = "Hinoki database engine: typed values, pooling, transactions (pure Rust, no Python)"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
tokio = { version = "1", features = ["rt", "time", "macros"] }
tokio-postgres = { version = "0.7", features = ["with-uuid-1", "with-chrono-0_4", "with-serde_json-1"] }
tokio-postgres-rustls = { version = "0.14", features = ["ring", "webpki-roots"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
deadpool-postgres = { version = "0.14", features = ["rt_tokio_1"] }
rustls-pki-types = "1"
webpki-roots = "1"
percent-encoding = "2"
uuid = "1"
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
serde_json = { version = "1", features = ["arbitrary_precision"] }
bytes = "1"

[dev-dependencies]
uuid = { version = "1", features = ["v4"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "net", "io-util"] }
