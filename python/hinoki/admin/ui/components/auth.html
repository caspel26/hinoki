<!doctype html>
<html lang="en" data-theme="{{ theme }}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>{{ title }} · {{ site }}</title>
<link rel="stylesheet" href="{{ stylesheet }}">
</head>
<body class="hn-auth">
{{{ sprite }}}
<main class="hn-auth-card" id="main">
<h1>{{ site }}</h1>
<p class="hn-auth-title">{{ title }}</p>
{{{ notice }}}
<form class="hn-form" method="post" action="{{ action }}" novalidate>
<input type="hidden" name="csrf" value="{{ csrf }}">
<div class="hn-form-body">
{{{ fields }}}
</div>
<footer class="hn-form-foot">
{{{ links }}}
<button class="hn-btn hn-primary" type="submit">{{ submit }}</button>
</footer>
</form>
</main>
</body>
</html>
