<form class="hn-form" method="post" action="{{ action }}" novalidate>
<input type="hidden" name="csrf" value="{{ csrf }}">
<div class="hn-form-body">
{{{ summary }}}
{{{ fields }}}
{{{ meta }}}
</div>
<footer class="hn-form-foot">
{{{ delete }}}

<button class="hn-btn hn-primary" type="submit">{{ submit }}</button>
</footer>
</form>
