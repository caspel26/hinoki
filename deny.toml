# Dependency policy checked by `cargo deny check` (see CI). Licences allowed are
# permissive ones compatible with this project's MIT licence.
[graph]
all-features = true

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "Zlib",
    "CC0-1.0",
]
confidence-threshold = 0.9

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true  # the workspace crates depend on each other by path

[advisories]
version = 2

[sources]
unknown-registry = "deny"
unknown-git = "deny"
