# Dependency policy checked by `cargo deny check` (see CI). Licences allowed are
# permissive ones compatible with this project's MIT licence.
[graph]
all-features = true

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "Zlib",
    "CC0-1.0",
    # The bundled public root certificate data uses this permissive data licence.
    "CDLA-Permissive-2.0",
]
confidence-threshold = 0.9

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true  # the workspace crates depend on each other by path

[advisories]
version = 2
ignore = [
    # chrono is reported unmaintained (no vulnerability). It is also pulled in
    # through tokio-postgres (postgres-types) and mysql_async, so removing it
    # needs a driver-feature and timestamp-type migration tracked separately.
    { id = "RUSTSEC-2026-0543", reason = "unmaintained, no known vulnerability; migration tracked separately" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
