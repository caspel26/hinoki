sonar.projectKey=caspel26_hinoki
sonar.organization=caspel26
# Only the package: the Python package and the Rust crates. The scanner ignores
# sonar.sources and analyses the whole project, so everything else is excluded.
# The admin components are fragments: their <li>, <th> and <ul> live in the page
# that includes them, so the HTML rules misfire on them.
sonar.exclusions=**/*.pyi,**/target/**,tests/**,benchmarks/**,examples/**,theme/**,docsite/**,scripts/**,.github/**,docs/**,python/hinoki/admin/ui/components/**
sonar.python.version=3.12,3.13,3.14
