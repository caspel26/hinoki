[project]
name = "hinoki-comparative-bench"
version = "0.0.0"
requires-python = ">=3.13"
dependencies = [
    "hinoki-api",
    "granian>=2.8,<3",
    "fastapi==0.162.7",
    "uvicorn==0.54.0",
    "sqlalchemy[asyncio]==2.1.8",
    "asyncpg==0.32.0",
    "django-ninja==1.8.0",
    "django==6.1.3",
    "django-bolt==0.13.0",
    "psycopg[binary,pool]==3.3.9",
    "litestar[jwt]==2.25.0",
    "pyjwt==2.15.1",
    "httptools==0.9.0",
    "django-ninja-jwt==5.4.4",
]

[tool.uv.sources]
hinoki-api = { path = "../..", editable = true }

[tool.uv]
package = false
