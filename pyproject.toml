[build-system]
requires = ["maturin>=1.16.0,<2"]
build-backend = "maturin"

[project]
name = "hinoki-api"
version = "0.0.1"
description = "Pre-alpha Python API framework with a Rust extension for routing, schemas, cryptography and SQL ORM."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Giuseppe Casillo" }]
keywords = ["api", "framework", "asgi", "orm", "rust"]
requires-python = ">=3.12"
dependencies = []
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Environment :: Web Environment",
    "Framework :: AsyncIO",
    "Intended Audience :: Developers",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: Implementation :: CPython",
    "Programming Language :: Rust",
    "Topic :: Internet :: WWW/HTTP",
    "Typing :: Typed",
]

[project.urls]
Homepage = "https://hinoki.caspel.dev/"
Documentation = "https://hinoki.caspel.dev/"
Repository = "https://github.com/caspel26/hinoki"
Issues = "https://github.com/caspel26/hinoki/issues"
Changelog = "https://github.com/caspel26/hinoki/blob/main/CHANGELOG.md"

[project.scripts]
hinoki = "hinoki.__main__:main"

[project.optional-dependencies]
server = ["granian[reload]>=2.8.8,<3"]

[dependency-groups]
dev = [
    { include-group = "lint" },
    { include-group = "typecheck" },
    { include-group = "test" },
    "pre-commit>=4.0",
]
lint = ["complexipy==9.0.0", "ruff==0.17.6"]
docs = [
    "mike==2.2.0",
    "mkdocs-git-revision-date-localized-plugin>=1.7.0",
    "mkdocs-material>=9.6",
    "mkdocstrings[python]>=1.0.8",
]
typecheck = ["mypy>=1.14"]
test = [
    "pytest>=8.3",
    "pytest-asyncio>=1.0",
    "pytest-cov>=6.0",
    "pytest-xdist>=3.6",
    "granian[reload]>=2.8.8,<3",
    "openapi-spec-validator>=0.7",
    "markdown>=3.6",
]

[tool.maturin]
python-source = "python"
module-name = "hinoki.core"
manifest-path = "crates/bindings/Cargo.toml"

[tool.uv]
# Rebuild the extension when Rust sources change.
cache-keys = [{ file = "pyproject.toml" }, { file = "Cargo.toml" }, { file = "crates/**/*.rs" }, { file = "crates/**/Cargo.toml" }]

[tool.ruff]
line-length = 88
target-version = "py312"
extend-exclude = ["framework-handoff", "sources"]

[tool.ruff.lint]
# Mirrors the SonarQube Python rules that Ruff can express: complexity
# (S3776), parameter/return counts (S107/S1142), unused parameters (S1172),
# commented-out code (S125), redundant returns, bug-prone patterns.
select = ["E", "F", "W", "I", "UP", "B", "SIM", "C90", "C4", "RUF", "PT", "TID", "PL", "ERA", "ARG", "RET", "PERF", "S"]
ignore = ["PT018"]  # compound asserts are the clearest way to narrow Optionals

[tool.ruff.lint.mccabe]
max-complexity = 10
[tool.ruff.lint.pylint]
max-args = 7
max-returns = 4
max-branches = 8
[tool.ruff.lint.per-file-ignores]
"tests/harness.py" = ["PLR0913", "PLR0917"]  # mirrors the ASGI scope fields a test may set
"tests/mcpclient/*.py" = ["E501", "S607", "S603", "S101"]  # standalone verification scripts
"python/hinoki/ai/proposals.py" = ["E501"]  # emits source text, one line per output line
"tests/dbtest.py" = ["S608", "PT012"]
"tests/ormtest.py" = ["PT012"]
"tests/schemasecrettest.py" = ["S105", "S106"]  # synthetic secrets and the mask
"tests/mail*.py" = ["S105", "S106", "S301"]  # synthetic secrets; pickling our own error
"tests/mailserver.py" = ["PLR0911", "PLR0912"]  # a protocol dispatcher
"tests/runtime/granianblogtest.py" = ["S106"]  # table names are test-controlled; blocks need setup
"tests/browser/verify.py" = ["PLR0915", "S105", "E501", "SIM222", "RUF059"]  # a linear script with a demo token
"examples/blog/blog/apps/blog/seed.py" = ["S106"]  # synthetic demo tokens
"examples/blog/blog/apps/blog/adminsite.py" = ["ARG001", "ARG002"]  # overrides of admin hooks
"benchmarks/**" = ["ARG001", "S101"]  # benchmark handlers ignore the request
"scripts/readme_demo.py" = ["S603", "S607"]  # runs hinoki, uv, git and ffmpeg by hand to render the README GIF
"benchmarks/comparative/*.py" = ["E501", "PLR2004", "S603", "S607", "S310", "S105", "S608", "PLC0415"]  # run by hand with its own environment: subprocesses, a demo password, loopback URLs
"python/hinoki/resources.py" = ["ARG001"]
"python/hinoki/admin/themes.py" = ["E501"]  # token tables
"python/hinoki/scaffold.py" = ["E501"]  # file templates
"python/hinoki/ai/errorcatalog.py" = ["E501"]  # explanatory text
"tests/schemadifftest.py" = ["E501", "S311", "RUF001"]
"tests/adminreviewtest.py" = ["E501"]
"tests/authtest.py" = ["E501"]
"tests/themecontrasttest.py" = ["E501"]
"tests/scaffoldtest.py" = ["E501"]
"tests/cryptotest.py" = ["E501", "PLR0913", "S105", "S106"]
"tests/blogrulestest.py" = ["E501"]
"tests/schemareviewtest.py" = ["E501", "S105"]
"tests/schemaencodetest.py" = ["E501", "S106", "S311"]  # seeded generators for differential tests
"tests/admintest.py" = ["E501", "C408", "S106", "RUF001", "RUF059"]  # long request lines, small lambdas
# Inline HTML fragments are clearer on one line than split across string pieces.
"python/hinoki/admin/{lists,site,views,formpages}.py" = ["E501", "PLR0911"]
"python/hinoki/admin/modeladmin.py" = ["ARG002"]  # overridable hooks
"python/hinoki/app.py" = ["PLR0913"]  # Hinoki takes keyword-only options
"python/hinoki/routing.py" = ["PLR0913"]  # each decorator mirrors the Options fields
"tests/**" = ["S101", "PLR2004", "ARG001", "ARG002", "S104", "S603", "S310"]
"examples/*/*_tests/**" = ["S101", "S105", "S106", "PLR2004", "ARG001", "ARG002"]
[tool.ruff.lint.isort]
known-first-party = ["hinoki", "examples", "tests"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_ignores = true
files = ["python/hinoki", "tests", "examples", "docsite/llms.py"]
# Playwright is a development tool run with uvx, not a project dependency.
exclude = ["tests/browser/", "tests/mcpclient/"]
mypy_path = "python:examples/notes:examples/tracker:examples/blog:examples/mailroom:examples/tracker/tracker_tests/support:examples/blog/blog_tests/support"
explicit_package_bases = true

[tool.pytest.ini_options]
testpaths = ["tests", "examples/notes/notes_tests", "examples/tracker/tracker_tests", "examples/blog/blog_tests", "examples/mailroom/mailroom_tests"]
python_files = ["*test.py"]
pythonpath = ["examples/notes", "examples/tracker", "examples/blog", "examples/mailroom", "examples/tracker/tracker_tests/support", "examples/blog/blog_tests/support"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-ra --strict-markers --ignore-glob=**/conftest.py"
markers = ["runtime: starts a real server process (Granian)"]

[tool.coverage.run]
source = ["hinoki"]
# The server and CLI tests run Hinoki in child processes: measure those too.
parallel = true
patch = ["subprocess"]
sigterm = true
[tool.coverage.report]
show_missing = true
