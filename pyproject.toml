[build-system]
requires = ["maturin>=1.9,<2"]
build-backend = "maturin"

[project]
name = "hinoki"
version = "0.0.1"
description = "Typed Python API framework with a native Rust core."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Peppe" }]
requires-python = ">=3.12"
dependencies = []
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Rust",
    "Typing :: Typed",
]

[project.urls]
Repository = "https://github.com/caspel26/hinoki"

[dependency-groups]
dev = [
    { include-group = "lint" },
    { include-group = "typecheck" },
    { include-group = "test" },
    "pre-commit>=4.0",
]
lint = ["ruff==0.15.12"]
typecheck = ["mypy>=1.14"]
test = [
    "pytest>=8.3",
    "pytest-asyncio>=1.0",
    "pytest-cov>=6.0",
    "granian>=2.8,<3",
    "openapi-spec-validator>=0.7",
]

[tool.maturin]
python-source = "python"
module-name = "hinoki.native"
manifest-path = "crates/bindings/Cargo.toml"
features = ["pyo3/extension-module"]

[tool.uv]
# Rebuild the extension when Rust sources change.
cache-keys = [{ file = "pyproject.toml" }, { file = "Cargo.toml" }, { file = "crates/**/*.rs" }, { file = "crates/**/Cargo.toml" }]

[tool.ruff]
line-length = 88
target-version = "py312"
extend-exclude = ["framework-handoff", "sources"]

[tool.ruff.lint]
# Mirrors the SonarQube Python rules that Ruff can express: complexity
# (S3776), parameter/return counts (S107/S1142), unused parameters (S1172),
# commented-out code (S125), redundant returns, bug-prone patterns.
select = ["E", "F", "W", "I", "UP", "B", "SIM", "C90", "C4", "RUF", "PT", "TID", "PL", "ERA", "ARG", "RET", "PERF", "S"]
ignore = ["PT018"]  # compound asserts are the clearest way to narrow Optionals

[tool.ruff.lint.mccabe]
max-complexity = 10
[tool.ruff.lint.pylint]
max-args = 7
max-returns = 4
max-branches = 8
[tool.ruff.lint.per-file-ignores]
"tests/harness.py" = ["PLR0913"]  # mirrors the ASGI scope fields a test may set
"tests/dbtest.py" = ["S608", "PT012"]
"tests/ormtest.py" = ["PT012"]
"tests/blogtest.py" = ["S106"]  # fixture tokens, not secrets
"tests/runtime/granianblogtest.py" = ["S106"]  # table names are test-controlled; blocks need setup
# The request is a mandatory first parameter that a handler need not read.
"examples/**" = ["ARG001", "ARG002"]
"tests/browser/verify.py" = ["PLR0915", "S105", "E501", "SIM222", "RUF059"]  # a linear script with a demo token
"examples/blog/seed.py" = ["S106"]  # synthetic demo tokens
"benchmarks/**" = ["ARG001", "S101"]  # benchmark handlers ignore the request
"python/hinoki/crud.py" = ["ARG001"]
"python/hinoki/admin/themes.py" = ["E501"]  # token tables
"tests/schemadifftest.py" = ["E501", "S311", "RUF001"]
"tests/adminreviewtest.py" = ["E501"]
"tests/schemaencodetest.py" = ["E501", "S106", "S311"]  # seeded generators for differential tests
"tests/admintest.py" = ["E501", "C408", "S106", "RUF001", "RUF059"]  # long request lines, small lambdas
# Inline HTML fragments are clearer on one line than split across string pieces.
"python/hinoki/admin/{lists,site,views,formpages}.py" = ["E501", "PLR0911"]
"python/hinoki/admin/modeladmin.py" = ["ARG002"]  # overridable hooks
"python/hinoki/app.py" = ["PLR0913"]  # HinokiAPI takes keyword-only options
"python/hinoki/routing.py" = ["PLR0913"]  # each decorator mirrors the Options fields
"tests/**" = ["S101", "PLR2004", "ARG001", "ARG002", "S104", "S603", "S310"]
[tool.ruff.lint.isort]
known-first-party = ["hinoki", "examples", "tests"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_ignores = true
files = ["python/hinoki", "tests", "examples"]
# Playwright is a development tool run with uvx, not a project dependency.
exclude = ["tests/browser/"]
mypy_path = "python"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["*test.py"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-ra --strict-markers"
markers = ["runtime: starts a real server process (Granian)"]

[tool.coverage.run]
source = ["hinoki"]
[tool.coverage.report]
show_missing = true
