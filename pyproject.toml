[build-system]
requires = ["maturin>=1.9,<2"]
build-backend = "maturin"

[project]
name = "hinoki"
version = "0.0.1"
description = "Typed Python API framework with a native Rust core."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Peppe" }]
requires-python = ">=3.12"
dependencies = []
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Rust",
    "Typing :: Typed",
]

[project.urls]
Repository = "https://github.com/caspel26/hinoki"

[dependency-groups]
dev = [
    { include-group = "lint" },
    { include-group = "typecheck" },
    { include-group = "test" },
    "pre-commit>=4.0",
]
lint = ["ruff==0.15.12"]
typecheck = ["mypy>=1.14"]
test = ["pytest>=8.3", "pytest-cov>=6.0", "granian>=2.8,<3"]

[tool.maturin]
python-source = "python"
module-name = "hinoki._core"
manifest-path = "crates/bindings/Cargo.toml"
features = ["pyo3/extension-module"]

[tool.uv]
# Rebuild the extension when Rust sources change.
cache-keys = [{ file = "pyproject.toml" }, { file = "Cargo.toml" }, { file = "crates/**/*.rs" }, { file = "crates/**/Cargo.toml" }]

[tool.ruff]
line-length = 88
target-version = "py312"
extend-exclude = ["framework-handoff", "sources"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "C90", "RUF", "PT", "TID"]
ignore = ["PT018"]  # compound asserts are the clearest way to narrow Optionals

[tool.ruff.lint.mccabe]
max-complexity = 10
[tool.ruff.lint.isort]
known-first-party = ["hinoki"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_ignores = true
files = ["python/hinoki", "tests"]
mypy_path = "python"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = ["runtime: starts a real server process (Granian)"]

[tool.coverage.run]
source = ["hinoki"]
[tool.coverage.report]
show_missing = true
