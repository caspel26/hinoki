site_name: Hinoki
site_description: A Python API framework that checks its own architecture.
site_url: https://caspel26.github.io/hinoki/
docs_dir: docs
strict: true
exclude_docs: |
  **/*-DESIGN.md
  IDENTITY.md
  adr/**
validation:
  links:
    absolute_links: relative_to_docs
    unrecognized_links: warn

theme:
  name: material
  logo: assets/hinoki-mark.png
  features:
    - navigation.tabs
    - navigation.instant
    - navigation.tracking
    - navigation.sections
    - navigation.top
    - navigation.footer
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.tabs.link
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle: {icon: material/weather-night, name: Dark mode}
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle: {icon: material/weather-sunny, name: Light mode}
  font:
    text: Inter
    code: JetBrains Mono
  icon:
    repo: fontawesome/brands/github

extra_css:
  - stylesheets/extra.css

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/caspel26/hinoki
      name: Hinoki on GitHub

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [python]
          options:
            show_source: false
            show_root_heading: true
            heading_level: 3
            docstring_style: google
            members_order: source
            show_signature_annotations: true
            separate_signature: true

nav:
  - Get started:
      - Home: index.md
      - Getting started: getting-started.md
  - Tutorial:
      - Overview: tutorial/index.md
      - 1. Models: tutorial/1-models.md
      - 2. Schemas: tutorial/2-schemas.md
      - 3. Operations: tutorial/3-operations.md
      - 4. Endpoints: tutorial/4-endpoints.md
      - 5. Rules: tutorial/5-rules.md
      - 6. Run and test it: tutorial/6-run.md
  - Guides:
      - Data:
          - Schemas: SCHEMAS.md
          - Model options: MODEL-OPTIONS.md
          - Utilities: UTILITIES.md
          - Relations: RELATIONS.md
          - Migrations: MIGRATIONS.md
      - Endpoints:
          - Parsers and renderers: CODECS.md
          - Patterns and best practices: PATTERNS.md
      - Security and checks:
          - Rules: RULES.md
      - Operating:
          - Settings: SETTINGS.md
          - Running an application: SERVING.md
          - Typing: TYPING.md
          - Toolchain and CI: TOOLCHAIN.md
      - Working with AI:
          - Build with an agent: AI-WORKFLOW.md
          - Application MCP: APP-MCP.md
      - Admin:
          - The admin: ADMIN.md
  - Concepts:
      - Sync and async: SYNC-ASYNC.md
      - Glossary: GLOSSARY.md
  - Reference:
      - Overview: reference/index.md
      - Routing and requests: reference/web.md
      - Schemas: reference/schemas.md
      - Models and queries: reference/orm.md
      - Auth and crypto: reference/auth.md
      - Settings: reference/settings.md
      - Testing: reference/testing.md
      - Utilities: reference/utilities.md
  - Project:
      - Status: STATUS.md
      - Roadmap: https://github.com/caspel26/hinoki/blob/main/ROADMAP.md
      - Contributing: https://github.com/caspel26/hinoki/blob/main/CONTRIBUTING.md
      - Troubleshooting: TROUBLESHOOTING.md
      - Toolchain and CI: TOOLCHAIN.md
