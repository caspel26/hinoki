site_name: Hinoki
site_description: High-throughput Python API framework powered by a Rust HTTP server and SQL ORM. One typed declaration drives routing, validation, OpenAPI, architecture rules, and MCP.
site_url: https://hinoki.caspel.dev/
docs_dir: docs
strict: true
exclude_docs: |
  **/*-DESIGN.md
  Q060-SERVER-DECISION-BRIEF.md
  IDENTITY.md
  adr/**
validation:
  links:
    absolute_links: relative_to_docs
    unrecognized_links: warn

theme:
  name: null
  custom_dir: theme

hooks:
  - docsite/hooks.py

extra:
  generator: false
  hn_tagline: Typed Python APIs. Architecture rules you can run.
  # Read by docsite/hooks.py; sections and pages that go under `Optional` in
  # llms.txt and stay out of llms-full.txt.
  llms:
    optional:
      - Reference
      - Project
      - benchmarks.md
      - changelog.md
      - rust-crud-orientation.md
    index_max_bytes: 24576
    full_max_bytes: 2097152

repo_url: https://github.com/caspel26/hinoki
repo_name: caspel26/hinoki
edit_uri: edit/main/docs/
copyright: hinoki v0.0.1 · pre-alpha · MIT · &copy; 2026 caspel26

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true

plugins:
  - search
  - mike:
      alias_type: redirect
      version_selector: false
  - git-revision-date-localized:
      enable_creation_date: false
      fallback_to_build_date: true
      type: date
  - mkdocstrings:
      handlers:
        python:
          paths: [python]
          options:
            show_source: false
            filters: ["!^_"]
            merge_init_into_class: true
            show_root_heading: true
            heading_level: 2
            docstring_style: google
            members_order: source
            show_signature_annotations: true
            separate_signature: true

