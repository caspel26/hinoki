site_name: Hinoki
site_description: A Python API framework that checks its own architecture.
site_url: https://caspel26.github.io/hinoki/
docs_dir: docs
strict: true
exclude_docs: |
  **/*-DESIGN.md
  IDENTITY.md
  adr/**
validation:
  links:
    absolute_links: relative_to_docs
    unrecognized_links: warn

theme:
  name: null
  custom_dir: theme

hooks:
  - docsite/hooks.py

extra:
  generator: false
  hn_version: "0.0.1"

repo_url: https://github.com/caspel26/hinoki
repo_name: caspel26/hinoki
edit_uri: edit/main/docs/
copyright: hinoki v0.0.1 · pre-alpha · MIT · &copy; 2026 caspel26

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
  - pymdownx.inlinehilite
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true

plugins:
  - search
  - git-revision-date-localized:
      enable_creation_date: false
      fallback_to_build_date: true
      type: date
  - mkdocstrings:
      handlers:
        python:
          paths: [python]
          options:
            show_source: false
            filters: ["!^_[^_]"]
            show_root_heading: true
            heading_level: 2
            docstring_style: google
            members_order: source
            show_signature_annotations: true
            separate_signature: true

nav:
  - Home: index.md
  - Get started:
      - Installation: getting-started.md
      - Quick start: QUICK-START.md
  - Tutorial:
      - Overview: tutorial/index.md
      - 1. Models: tutorial/1-models.md
      - 2. Schemas: tutorial/2-schemas.md
      - 3. Operations: tutorial/3-operations.md
      - 4. Endpoints: tutorial/4-endpoints.md
      - 5. Rules: tutorial/5-rules.md
      - 6. Run and test it: tutorial/6-run.md
  - Guides:
      - Overview: GUIDES.md
      - Data:
          - Models and queries: MODELS.md
          - Schemas: SCHEMAS.md
          - Model-derived schemas: MODEL-SCHEMAS.md
          - Model options: MODEL-OPTIONS.md
          - Utilities: UTILITIES.md
          - Relations: RELATIONS.md
          - Migrations: MIGRATIONS.md
      - Endpoints:
          - Endpoint declarations: ENDPOINTS.md
          - Errors: ERRORS.md
          - Pagination: PAGINATION.md
          - Parsers and renderers: CODECS.md
      - Security and checks:
          - Authentication and access: AUTHENTICATION.md
          - Rules: RULES.md
      - Runtime:
          - Application modules: MODULES.md
          - Transactions: TRANSACTIONS.md
          - Settings: SETTINGS.md
          - Serving: SERVING.md
          - Testing: TESTING.md
          - Command line: CLI.md
          - Typing: TYPING.md
      - Integrations:
          - Admin: ADMIN.md
          - Application MCP: APP-MCP.md
          - Development tools: AI-WORKFLOW.md
      - Operating:
          - Sync and async: SYNC-ASYNC.md
  - Concepts:
      - Overview: CONCEPTS.md
      - Request lifecycle: REQUEST-LIFECYCLE.md
      - Architecture patterns: PATTERNS.md
      - Glossary: GLOSSARY.md
  - Reference:
      - Overview: reference/index.md
      - Core API: reference/web.md
      - Schemas: reference/schemas.md
      - Models and queries: reference/orm.md
      - Parsers and renderers: reference/codecs.md
      - Auth and crypto: reference/auth.md
      - Database: reference/database.md
      - Settings: reference/settings.md
      - Rules: reference/rules.md
      - Modules and runtime: reference/runtime.md
      - MCP and scaffold: reference/tools.md
