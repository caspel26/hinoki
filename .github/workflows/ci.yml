name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  # A pull request that only touches documentation, the docsite theme, assets or
  # root Markdown skips the Python, Rust, wheel and audit work, and pre-commit
  # checks only the files of the pull request. The required checks keep their
  # names and finish green; docs always runs. Any doubt (a push, an API error)
  # runs everything.
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      code: ${{ steps.diff.outputs.code }}
    steps:
      - id: diff
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          code=true
          if [ "$EVENT" = pull_request ] \
            && files="$(gh api "repos/$REPO/pulls/$PR/files" --paginate \
              --jq '.[] | .filename, (.previous_filename // empty)')" \
            && [ -n "$files" ]; then
            code=false
            while IFS= read -r file; do
              case "$file" in
                docs/*|theme/*|assets/*|mkdocs.yml|LICENSE) ;;
                */*) code=true ;;
                *.md) ;;
                *) code=true ;;
              esac
            done <<< "$files"
          fi
          echo "code=$code" >> "$GITHUB_OUTPUT"

  python:
    name: Python ${{ matrix.python }}
    needs: changes
    # The matrix name is only expanded when the job runs, so a skipped job would
    # leave the required check pending: the steps are skipped instead.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: hinoki
          POSTGRES_DB: hinoki
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s
          --health-timeout 5s --health-retries 10
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: hinoki
          MYSQL_DATABASE: hinoki
          MYSQL_USER: hinoki
          MYSQL_PASSWORD: hinoki
        ports: ["3306:3306"]
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -uroot -phinoki --silent"
          --health-interval 5s --health-timeout 5s --health-retries 20
      mariadb:
        image: mariadb:11.4
        env:
          MARIADB_ROOT_PASSWORD: hinoki
          MARIADB_DATABASE: hinoki
          MARIADB_USER: hinoki
          MARIADB_PASSWORD: hinoki
        ports: ["3307:3306"]
        options: >-
          --health-cmd "healthcheck.sh --connect --innodb_initialized"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      HINOKI_TEST_DATABASE_URL: postgres://postgres:hinoki@localhost:5432/hinoki
      HINOKI_TEST_MYSQL_URL: mysql://hinoki:hinoki@localhost:3306/hinoki?require_ssl=false
      HINOKI_TEST_MARIADB_URL: mariadb://hinoki:hinoki@localhost:3307/hinoki?require_ssl=false
      # Without this, `uv run` follows .python-version and every job runs on 3.13.
      UV_PYTHON: ${{ matrix.python }}
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: needs.changes.outputs.code != 'false'
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        if: needs.changes.outputs.code != 'false'
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        if: needs.changes.outputs.code != 'false'
        with:
          enable-cache: true
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        if: needs.changes.outputs.code != 'false'
        with:
          key: python-${{ matrix.python }}
      - name: Verify lock is up to date
        if: needs.changes.outputs.code != 'false'
        run: uv lock --check
      - name: Install
        if: needs.changes.outputs.code != 'false'
        run: uv sync --locked
      - name: The environment runs the matrix interpreter
        if: needs.changes.outputs.code != 'false'
        run: uv run --locked python -c "import sys; assert sys.version_info[:2] == tuple(map(int, '${{ matrix.python }}'.split('.'))), sys.version"
      - name: Lint
        if: needs.changes.outputs.code != 'false'
        run: uv run --locked ruff check .
      - name: Format
        if: needs.changes.outputs.code != 'false'
        run: uv run --locked ruff format --check .
      - name: Cognitive complexity
        if: needs.changes.outputs.code != 'false'
        run: uv run --locked complexipy . --failed
      - name: Types and typing fixtures
        if: needs.changes.outputs.code != 'false'
        run: uv run --locked mypy
      - name: Build the test-only SQL trace extension
        if: needs.changes.outputs.code != 'false'
        run: uv run --with "maturin>=1.9.4,<2" maturin develop --manifest-path crates/bindings/Cargo.toml --features sql-trace
      - name: One database per pytest-xdist worker
        if: needs.changes.outputs.code != 'false'
        run: |
          for worker in gw0 gw1 gw2 gw3; do
            PGPASSWORD=hinoki psql -h localhost -U postgres -c "CREATE DATABASE hinoki_$worker"
            for port in 3306 3307; do
              mysql -h 127.0.0.1 -P $port -uroot -phinoki -e \
                "CREATE DATABASE hinoki_$worker; GRANT ALL ON hinoki_$worker.* TO 'hinoki'@'%'"
            done
          done
      - name: Tests
        if: needs.changes.outputs.code != 'false'
        env:
          # The native write differential tests fail, not skip, without the trace build.
          HINOKI_REQUIRE_SQL_TRACE: "1"
        run: |
          # Process-heavy integration tests are timing-sensitive: run them alone.
          ISOLATED_TESTS="tests/runtime tests/kisoservertest.py tests/kisoclitest.py tests/wsgitest.py tests/ratelimitservertest.py tests/kisometricstest.py tests/kisoreloadtest.py tests/ratelimitsharedtest.py tests/adminsharedlimittest.py"
          uv run --no-sync --locked pytest -n 4 --cov \
            --ignore=tests/runtime --ignore=tests/kisoservertest.py \
            --ignore=tests/kisoclitest.py --ignore=tests/wsgitest.py \
            --ignore=tests/ratelimitservertest.py --ignore=tests/kisometricstest.py \
            --ignore=tests/kisoreloadtest.py --ignore=tests/ratelimitsharedtest.py \
            --ignore=tests/adminsharedlimittest.py
          uv run --no-sync --locked pytest $ISOLATED_TESTS --cov --cov-append --cov-report=xml
      - name: Save coverage report
        if: needs.changes.outputs.code != 'false' && matrix.python == '3.13'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: python-coverage
          path: coverage.xml
          if-no-files-found: error
          retention-days: 1

  coverage:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: python
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: python-coverage
      - uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          files: coverage.xml
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: true
      # The main analysis runs here, not in sonar.yml, so it can read coverage.xml.
      - uses: SonarSource/sonarqube-scan-action@59202af334b4ba7b5db01b701b8e79f8b3bef0f4 # v8.5.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  rust:
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' }}
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: hinoki
          POSTGRES_DB: hinoki
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s
          --health-timeout 5s --health-retries 10
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: hinoki
          MYSQL_DATABASE: hinoki
          MYSQL_USER: hinoki
          MYSQL_PASSWORD: hinoki
        ports: ["3306:3306"]
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -uroot -phinoki --silent"
          --health-interval 5s --health-timeout 5s --health-retries 20
      mariadb:
        image: mariadb:11.4
        env:
          MARIADB_ROOT_PASSWORD: hinoki
          MARIADB_DATABASE: hinoki
          MARIADB_USER: hinoki
          MARIADB_PASSWORD: hinoki
        ports: ["3307:3306"]
        options: >-
          --health-cmd "healthcheck.sh --connect --innodb_initialized"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      HINOKI_TEST_DATABASE_URL: postgres://postgres:hinoki@localhost:5432/hinoki
      HINOKI_TEST_MYSQL_URL: mysql://hinoki:hinoki@localhost:3306/hinoki?require_ssl=false
      HINOKI_TEST_MARIADB_URL: mariadb://hinoki:hinoki@localhost:3307/hinoki?require_ssl=false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          components: rustfmt, clippy
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
      - name: Install Python for PyO3 workspace tests
        run: |
          uv python install 3.13
          PYTHON="$(uv python find 3.13)"
          PYTHON_LIBDIR="$("$PYTHON" -c 'import sysconfig; print(sysconfig.get_config_var("LIBDIR"))')"
          PYTHON_LIBRARY="$("$PYTHON" -c 'import sysconfig; print(sysconfig.get_config_var("LDLIBRARY"))')"
          test -f "$PYTHON_LIBDIR/$PYTHON_LIBRARY"
          echo "PYO3_PYTHON=$PYTHON" >> "$GITHUB_ENV"
          echo "LD_LIBRARY_PATH=$PYTHON_LIBDIR${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}" >> "$GITHUB_ENV"
          "$PYTHON" -c 'import sys, sysconfig; print(sys.executable); print(sysconfig.get_config_var("LIBDIR")); print(sysconfig.get_config_var("LDLIBRARY"))'
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Clippy for the test-only SQL trace feature
        run: cargo clippy -p hinoki-bindings --all-targets --features sql-trace -- -D warnings
      - name: Cognitive complexity
        run: |
          cargo install rust-code-analysis-cli --version 0.0.25 --locked --root "$RUNNER_TEMP/rust-code-analysis"
          mkdir -p "$RUNNER_TEMP/rust-complexity"
          "$RUNNER_TEMP/rust-code-analysis/bin/rust-code-analysis-cli" \
            -m -p crates -O json --pr -o "$RUNNER_TEMP/rust-complexity"
          python3 scripts/check_rust_complexity.py "$RUNNER_TEMP/rust-complexity"
      - name: Tests with plaintext and TLS PostgreSQL
        run: |
          set -eu
          TLS_DIR="$RUNNER_TEMP/hinoki-postgres-tls"
          mkdir -p "$TLS_DIR"
          openssl req -x509 -newkey rsa:2048 -nodes \
            -keyout "$TLS_DIR/ca.key" -out "$TLS_DIR/ca.crt" \
            -subj "/CN=Hinoki disposable test CA" -days 3 \
            -addext "basicConstraints=critical,CA:TRUE" \
            -addext "keyUsage=critical,keyCertSign,cRLSign"
          openssl req -newkey rsa:2048 -nodes \
            -keyout "$TLS_DIR/server.key" -out "$TLS_DIR/server.csr" \
            -subj "/CN=localhost"
          printf 'subjectAltName=DNS:localhost\nextendedKeyUsage=serverAuth\n' > "$TLS_DIR/server.ext"
          openssl x509 -req -in "$TLS_DIR/server.csr" \
            -CA "$TLS_DIR/ca.crt" -CAkey "$TLS_DIR/ca.key" -CAcreateserial \
            -out "$TLS_DIR/server.crt" -days 3 -extfile "$TLS_DIR/server.ext"
          docker run --rm -d --name hinoki-ci-postgres-tls \
            -p 127.0.0.1:5433:5432 \
            -e POSTGRES_PASSWORD=hinoki -e POSTGRES_DB=hinoki \
            -v "$TLS_DIR:/certs:ro" postgres:17 sh -ec '
              cp /certs/server.crt /tmp/server.crt
              cp /certs/server.key /tmp/server.key
              chown postgres:postgres /tmp/server.crt /tmp/server.key
              chmod 600 /tmp/server.key
              exec docker-entrypoint.sh postgres -c ssl=on \
                -c ssl_cert_file=/tmp/server.crt -c ssl_key_file=/tmp/server.key
            '
          trap 'docker stop hinoki-ci-postgres-tls >/dev/null 2>&1 || true' EXIT
          attempts=0
          until docker exec hinoki-ci-postgres-tls pg_isready -h 127.0.0.1 -p 5432 -U postgres -d hinoki; do
            attempts=$((attempts + 1))
            if [ "$attempts" -ge 30 ]; then exit 1; fi
            sleep 1
          done
          HINOKI_TEST_DATABASE_TLS_URL="postgres://postgres:hinoki@localhost:5433/hinoki?sslmode=require&sslrootcert=$TLS_DIR/ca.crt" \
            cargo test --workspace
      - name: Test ORM against MariaDB
        env:
          HINOKI_TEST_MYSQL_URL: mariadb://hinoki:hinoki@localhost:3307/hinoki?require_ssl=false
        run: cargo test --locked -p hinoki-orm --test mysql

  audit:
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
      # Prebuilt, checksum-verified binaries: compiling both tools took about 4 minutes.
      - uses: taiki-e/install-action@75a7c0f87bd666af3cdb75c5b9e9d03ab6044e6f # v2.90.6
        with:
          tool: cargo-audit,cargo-deny
      - name: Audit Cargo.lock against the RustSec advisory database
        run: cargo audit
      - name: Check licences, bans and sources (deny.toml)
        run: cargo deny check
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
      - name: Audit uv.lock against the Python advisory database
        run: |
          uv export --locked --all-groups --all-extras --no-emit-project \
            --format requirements-txt -o "$RUNNER_TEMP/requirements.txt"
          uvx pip-audit==2.10.1 --require-hashes --disable-pip \
            -r "$RUNNER_TEMP/requirements.txt"

  docs:
    runs-on: ubuntu-latest
    env:
      NO_MKDOCS_2_WARNING: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          enable-cache: true
      - name: Build the documentation site, strictly (broken links fail)
        run: uv run --locked --group docs mkdocs build --strict -d /tmp/site
      - name: Check the llms.txt outputs exist
        run: test -s /tmp/site/llms.txt && test -s /tmp/site/llms-full.txt && test -s /tmp/site/crud.md

  wheel:
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
      - name: Build abi3 wheel
        run: uv build --wheel
      - name: Verify the core extension has its matching stub
        run: |
          python - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile

          wheel = next(Path("dist").glob("hinoki_api-*.whl"))
          with ZipFile(wheel) as archive:
              files = set(archive.namelist())
          assert "hinoki/core.pyi" in files
          assert any(name.startswith("hinoki/core.") and name.endswith(".so") for name in files)
          PY
      - name: Smoke-test the wheel in a clean environment
        run: |
          uv sync --locked --group typecheck
          uv venv --python 3.12 /tmp/wheel-env
          uv pip install --python /tmp/wheel-env/bin/python dist/*.whl
          cd /tmp
          "${GITHUB_WORKSPACE}/.venv/bin/mypy" --config-file=/dev/null --strict \
            --python-executable=/tmp/wheel-env/bin/python \
            "${GITHUB_WORKSPACE}/tests/typing/core.py"
          /tmp/wheel-env/bin/python -c "import hinoki; print(hinoki.__version__)"
      - name: Smoke-test the packaged data files and native features
        run: |
          /tmp/wheel-env/bin/python - <<'PY'
          from hinoki import Schema, core
          from hinoki.admin.templates import Templates
          from hinoki.docsui import pages

          class T(Schema):
              name: str

          assert T.validate({"name": "x"}).name == "x"
          assert core.Router.__module__ == "hinoki.core"
          assert core.DatabaseError.__module__ == "hinoki.core"
          assert core.encode_json(T(name="x")) == b'{"name":"x"}'
          assert len(Templates(theme="console").stylesheet()) > 1000
          assert len(pages("/o", "/d", "/r")) == 7
          assert core.verify_password("a", core.hash_password("a", 19456, 2, 1))
          print("wheel smoke ok")
          PY

  pre-commit:
    needs: changes
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The base commit is needed to check only the files of a pull request.
          fetch-depth: 0
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          components: rustfmt
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
      - run: uv sync --locked
      - name: Run the hooks
        env:
          CODE: ${{ needs.changes.outputs.code }}
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ "$CODE" = false ]; then
            uv run --locked pre-commit run --from-ref "$BASE" --to-ref HEAD
          else
            uv run --locked pre-commit run --all-files
          fi
