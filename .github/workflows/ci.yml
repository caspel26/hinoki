name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  python:
    name: Python ${{ matrix.python }}
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: hinoki
          POSTGRES_DB: hinoki
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s
          --health-timeout 5s --health-retries 10
    env:
      HINOKI_TEST_DATABASE_URL: postgres://postgres:hinoki@localhost:5432/hinoki
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Verify lock is up to date
        run: uv lock --check
      - name: Install
        run: uv sync --locked --python ${{ matrix.python }}
      - name: Lint
        run: uv run --locked ruff check .
      - name: Format
        run: uv run --locked ruff format --check .
      - name: Types and typing fixtures
        run: uv run --locked mypy
      - name: Tests
        run: uv run --locked pytest --cov

  rust:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: hinoki
          POSTGRES_DB: hinoki
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s
          --health-timeout 5s --health-retries 10
    env:
      HINOKI_TEST_DATABASE_URL: postgres://postgres:hinoki@localhost:5432/hinoki
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Audit Cargo.lock against the RustSec advisory database
        run: cargo install cargo-audit --locked && cargo audit
      - name: Check licences, bans and sources (deny.toml)
        run: cargo install cargo-deny --locked && cargo deny check

  docs:
    runs-on: ubuntu-latest
    env:
      NO_MKDOCS_2_WARNING: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Build the documentation site, strictly (broken links fail)
        run: uv run --locked --group docs mkdocs build --strict -d /tmp/site

  wheel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: astral-sh/setup-uv@v6
      - name: Build abi3 wheel
        run: uv build --wheel
      - name: Smoke-test the wheel in a clean environment
        run: |
          uv venv --python 3.12 /tmp/wheel-env
          uv pip install --python /tmp/wheel-env/bin/python dist/*.whl
          /tmp/wheel-env/bin/python -c "import hinoki; print(hinoki.__version__)"
      - name: Smoke-test the packaged data files and native features
        run: |
          /tmp/wheel-env/bin/python - <<'PY'
          from hinoki import Schema, native
          from hinoki.admin.templates import Templates
          from hinoki.docsui import pages

          class T(Schema):
              name: str

          assert T.validate({"name": "x"}).name == "x"
          assert native.encode_json(T(name="x")) == b'{"name":"x"}'
          assert len(Templates(theme="midnight").stylesheet()) > 1000
          assert len(pages("/o", "/d", "/r")) == 6
          assert native.verify_password("a", native.hash_password("a", 19456, 2, 1))
          print("wheel smoke ok")
          PY

  pre-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked
      - run: uv run --locked pre-commit run --all-files
