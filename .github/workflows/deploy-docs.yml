name: Deploy documentation

on:
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: documentation-pages
  cancel-in-progress: false

jobs:
  development:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Configure the documentation commit identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          enable-cache: true
      - name: Install the locked documentation toolchain
        run: uv sync --locked --group docs
      - name: Fetch the published version branch when it exists
        run: |
          if git ls-remote --exit-code --heads origin gh-pages >/dev/null 2>&1; then
            git fetch origin gh-pages:gh-pages
          fi
      - name: Publish only the development docs
        run: uv run --locked mike deploy --push --branch gh-pages --alias-type redirect dev
      - name: Keep the root on development until a release exists
        run: |
          if uv run --locked mike list --json --branch gh-pages | python -c 'import json, sys; versions = json.load(sys.stdin); sys.exit(0 if any("stable" in v.get("aliases", []) for v in versions) else 1)'; then
            echo "A stable release exists; leave the root redirect unchanged."
          else
            uv run --locked mike set-default --push --branch gh-pages dev
          fi
      - name: Copy llms.txt to the site root while dev is the default
        env:
          SOURCE_VERSION: dev
          TARGETS: "."
        run: |
          set -euo pipefail
          if uv run --locked mike list --json --branch gh-pages | python -c 'import json, sys; versions = json.load(sys.stdin); sys.exit(0 if any("stable" in v.get("aliases", []) for v in versions) else 1)'; then
            echo "A stable release exists; the root follows it."
            exit 0
          fi
          site="$RUNNER_TEMP/gh-pages"
          git worktree add "$site" gh-pages
          cp "$site/dev/llms.txt" "$site/dev/llms-full.txt" "$site/"
          git -C "$site" add llms.txt llms-full.txt
          if git -C "$site" diff --cached --quiet; then
            echo "The llms files are already current."
          else
            git -C "$site" commit -m "docs: copy llms.txt for dev to the site root"
            git -C "$site" push origin HEAD:gh-pages
          fi
          git worktree remove --force "$site"
      - name: Check the published llms.txt (best effort)
        env:
          LLMS_URL: https://hinoki.caspel.dev/dev/llms.txt
        run: |
          for attempt in 1 2 3 4 5; do
            if curl -fsI "$LLMS_URL"; then
              exit 0
            fi
            sleep 15
          done
          echo "::warning::$LLMS_URL is not reachable yet; the CDN may still be updating."

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.ref }}
      - name: Configure the documentation commit identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          enable-cache: true
      - name: Install the locked documentation toolchain
        run: uv sync --locked --group docs
      - name: Validate that the tag is the package version
        run: |
          uv run --locked python - "${GITHUB_REF_NAME}" <<'PY'
          import re
          import sys
          import tomllib
          from pathlib import Path

          tag = sys.argv[1]
          match = re.fullmatch(r"v(\d+\.\d+\.\d+)", tag)
          if match is None:
              raise SystemExit("release documentation tags must use vX.Y.Z")
          project = tomllib.loads(Path("pyproject.toml").read_text())
          if match.group(1) != project["project"]["version"]:
              raise SystemExit("release tag must match project.version in pyproject.toml")
          PY
      - name: Fetch the published version branch
        run: |
          if git ls-remote --exit-code --heads origin gh-pages >/dev/null 2>&1; then
            git fetch origin gh-pages:gh-pages
          else
            echo "The development documentation must be published before a release tag." >&2
            exit 1
          fi
      - name: Publish this release and move stable aliases
        run: |
          version="${GITHUB_REF_NAME#v}"
          uv run --locked mike deploy --push --branch gh-pages --alias-type redirect \
            --update-aliases "$version" stable latest
          uv run --locked mike set-default --push --branch gh-pages latest
      - name: Copy llms.txt to the site root and the stable and latest aliases
        env:
          TARGETS: ". stable latest"
        run: |
          set -euo pipefail
          source_version="${GITHUB_REF_NAME#v}"
          site="$RUNNER_TEMP/gh-pages"
          git worktree add "$site" gh-pages
          for target in $TARGETS; do
            mkdir -p "$site/$target"
            cp "$site/$source_version/llms.txt" "$site/$source_version/llms-full.txt" "$site/$target/"
            git -C "$site" add "$target/llms.txt" "$target/llms-full.txt"
          done
          if git -C "$site" diff --cached --quiet; then
            echo "The llms files are already current."
          else
            git -C "$site" commit -m "docs: copy llms.txt for $source_version to the site root"
            git -C "$site" push origin HEAD:gh-pages
          fi
          git worktree remove --force "$site"
      - name: Check the published llms.txt (best effort)
        env:
          LLMS_URL: https://hinoki.caspel.dev/llms.txt
        run: |
          for attempt in 1 2 3 4 5; do
            if curl -fsI "$LLMS_URL"; then
              exit 0
            fi
            sleep 15
          done
          echo "::warning::$LLMS_URL is not reachable yet; the CDN may still be updating."
