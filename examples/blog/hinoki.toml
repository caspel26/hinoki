[project]
application = "blog.main:app"
routes = "blog.routes:routes"

[[apps]]
name = "blog"
models = "blog.apps.blog.models"
migrations = "blog.apps.blog.migrations"
events = "blog.apps.blog.events:handlers"
requires = []

# The admin's own users and grants: an optional extra with its own migrations.
[[apps]]
name = "admin"
models = "hinoki.admin.users.models"
migrations = "hinoki.admin.users.migrations"
requires = []

# The shared rate limiter's table, used by POST /auth/login.
[[apps]]
name = "ratelimit"
models = "hinoki.ratelimit_store.models"
migrations = "hinoki.ratelimit_store.migrations"
requires = []
