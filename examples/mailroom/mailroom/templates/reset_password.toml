description = "Sent when someone asks to reset a password"
subject = "Reset your Mailroom password"
template = '''
<html><body>
<p>Hello {{ name }},</p>
<p>Someone asked to reset your password{% if requested_from %} from {{ requested_from }}{% endif %}.</p>
<p><a href="{{ link }}">Choose a new password</a></p>
<p>You are signed in on:</p>
<ul>
{% for device in devices %}
<li>{{ device.name }}</li>
{% endfor %}
</ul>
<p>If it was not you, ignore this message.</p>
</body></html>
'''
