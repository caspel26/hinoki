<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 460" width="1000" height="460" role="img" aria-label="Architecture: Model, Schema and Endpoint declarations form one declared contract, which routing, validation, access and transactions, the OpenAPI document, hinoki check rules and the development MCP all read. Table changes follow a separate lane: migrations plan, a reviewed SQL file, an explicit apply, then the database.">
  <style>
  text { font-family: ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif; }
  .k-server { --edge: #8fb8e0; --tint: #252a34; }
  .k-rust { --edge: #e3c29b; --tint: #2f2c2b; }
  .k-hinoki { --edge: #b9a0e7; --tint: #2a2734; }
  .k-yours { --edge: #86cfb3; --tint: #242d2e; }
  .k-amber { --edge: #e0bc7d; --tint: #342c20; }
  .k-core { --edge: #b9a0e7; --tint: #2a2734; }
  .node { fill: var(--tint); stroke: var(--edge); stroke-width: 1; }
  .core { stroke-width: 1.5; animation: breathe 4s ease-in-out infinite; }
  .title { fill: #eeedf2; font-size: 15px; font-weight: 600; }
  .sub { fill: #9d9ca9; font-size: 12px; font-family: 'IBM Plex Mono', ui-monospace, 'SF Mono', Menlo, Consolas, monospace; }
  .lane { fill: #e0bc7d; font-size: 12.5px; font-family: 'IBM Plex Mono', ui-monospace, 'SF Mono', Menlo, Consolas, monospace; }
  .arrow { fill: none; stroke: var(--edge); stroke-width: 1.2; opacity: 0.85; }
  .dot { fill: var(--edge); opacity: 0; offset-rotate: 0deg;
    animation: run 3.2s cubic-bezier(0.4, 0, 0.2, 1) infinite; }
  @keyframes run {
    0% { offset-distance: 0%; opacity: 0; }
    12% { opacity: 1; }
    88% { opacity: 1; }
    100% { offset-distance: 100%; opacity: 0; }
  }
  @keyframes breathe {
    0%, 100% { filter: drop-shadow(0 0 0 transparent); }
    50% { filter: drop-shadow(0 0 8px var(--edge)); }
  }
  @media (prefers-reduced-motion: reduce) {
    .dot, .core { animation: none; }
    .dot { opacity: 0; }
  }
</style>
  <defs><marker id="a-server" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#8fb8e0"/></marker><marker id="a-rust" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#e3c29b"/></marker><marker id="a-hinoki" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#b9a0e7"/></marker><marker id="a-yours" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#86cfb3"/></marker><marker id="a-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#e0bc7d"/></marker><marker id="a-core" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#b9a0e7"/></marker></defs>
  <rect x="0.5" y="0.5" width="999" height="459" rx="16" fill="#131317" stroke="#2c2c34"/>
  <g transform="translate(20 20)">
